appId: com.shanutechx.downloader
productName: SHANUTECHX Downloader
executableName: shanutechx-downloader
copyright: "© 2026 SHANUTECHX"
directories:
  output: dist
  buildResources: build
files:
  - dist/**/*
extraResources:
  - from: ../renderer/dist
    to: renderer/dist
asarUnpack:
  - "**/*.node"
win:
  target: [nsis]
  icon: build/icon.ico
  # Real OV/EV cert only — see Phase 5 of the implementation plan. Never ship
  # a self-signed cert in a production build config.
mac:
  target: [dmg]
  icon: build/icon.icns
  hardenedRuntime: true
  notarize: true
linux:
  target: [AppImage, deb]
  icon: build/icon.png
  category: Network
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
publish:
  provider: github
  owner: ShanudhaTirosh
  repo: shanutechx-downloader
  releaseType: release

