appId: com.shanutechx.downloader
productName: SHANUTECHX Downloader
executableName: shanutechx-downloader
copyright: "© 2026 SHANUTECHX"
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
extraResources:
  - from: ../renderer/dist
    to: renderer/dist
asarUnpack:
  - "**/*.node"
win:
  target: [nsis]
  icon: build/icon.ico
  # Real OV/EV cert only — see Phase 5 of the implementation plan. Never ship
  # a self-signed cert in a production build config.
mac:
  target: [dmg]
  icon: build/icon.icns
  hardenedRuntime: true
  notarize: true
linux:
  target: [AppImage, deb]
  icon: build/icon.png
  category: Network
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: generic
  # Point this at your own AWS VPS/Nginx-hosted update feed (electron-updater
  # reads latest.yml from here). Configure per-environment before release.
  url: https://updates.shanutechx.com/downloader/
