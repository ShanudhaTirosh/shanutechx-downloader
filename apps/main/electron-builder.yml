appId: com.shanutechx.stxdownloader
productName: STX Downloader
executableName: stx-downloader
copyright: "© 2026 STX Downloader • SHANUTECHX"
directories:
  output: release
  buildResources: ../../build
files:
  - dist/**/*
extraResources:
  - from: ../renderer/dist
    to: renderer/dist
  - from: ../../build/icon.ico
    to: icon.ico
# Unpack native .node addons outside the asar archive so the OS can load
# them directly. Without this, Windows can't resolve the VC++ runtime DLLs
# that better-sqlite3 and @napi-rs/keyring link against.
asarUnpack:
  - "**/*.node"
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/@napi-rs/keyring/**"
win:
  target: [nsis]
  icon: ../../build/icon.ico
  artifactName: "${productName}-Setup-${version}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "STX Downloader"
publish:
  provider: github
  owner: ShanudhaTirosh
  repo: shanutechx-downloader
  releaseType: release

