name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        # --ignore-scripts skips the root postinstall to avoid running
        # electron-rebuild against system Node before we're ready.
        # We run it explicitly below, targeted at the correct Electron binary.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild native modules for Electron
        # Compiles better-sqlite3, @napi-rs/keyring, and any other native
        # addons against the exact Electron binary that electron-builder will
        # package. Without this step the .node files ship compiled for system
        # Node, causing "missing DLL" / "invalid ELF" errors at runtime.
        run: pnpm --filter @shanutechx/main exec electron-rebuild -f -w better-sqlite3,@napi-rs/keyring
        env:
          npm_config_platform: win32
          npm_config_arch: x64

      - name: Build renderer
        run: pnpm --filter @shanutechx/renderer build

      - name: Build main
        run: pnpm --filter @shanutechx/main build

      - name: Package application
        run: pnpm --filter @shanutechx/main package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            apps/main/dist/**/*.exe
            apps/main/dist/**/*.yml
            apps/main/dist/**/*.yaml
            apps/main/dist/**/*.blockmap

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.yml
            artifacts/**/*.yaml
            artifacts/**/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
