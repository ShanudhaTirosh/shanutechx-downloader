<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)"/>
  
  <!-- Download arrow -->
  <g transform="translate(256, 180)">
    <!-- Arrow shaft -->
    <rect x="-30" y="0" width="60" height="160" rx="10" fill="url(#grad2)"/>
    
    <!-- Arrow head -->
    <path d="M -80 140 L 0 220 L 80 140 Z" fill="url(#grad2)"/>
  </g>
  
  <!-- Download tray/platform -->
  <rect x="106" y="380" width="300" height="40" rx="20" fill="url(#grad2)" opacity="0.9"/>
  
  <!-- Speed lines (for motion effect) -->
  <line x1="140" y1="200" x2="100" y2="200" stroke="url(#grad2)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <line x1="140" y1="240" x2="80" y2="240" stroke="url(#grad2)" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <line x1="140" y1="280" x2="100" y2="280" stroke="url(#grad2)" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  
  <line x1="372" y1="200" x2="412" y2="200" stroke="url(#grad2)" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <line x1="372" y1="240" x2="432" y2="240" stroke="url(#grad2)" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <line x1="372" y1="280" x2="412" y2="280" stroke="url(#grad2)" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
</svg>
